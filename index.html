<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blankenhagen Spieleentwicklung | 3D Würfelbecher Simulator</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: 'rgba(15, 23, 42, 0.75)',
                        glassBorder: 'rgba(255, 255, 255, 0.15)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 3D Libraries: Three.js & Cannon.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
            color: #f8fafc;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .glass-btn {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(67, 56, 202, 0.5));
            border: 1px solid rgba(129, 140, 248, 0.4);
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-btn:hover {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.5), rgba(67, 56, 202, 0.7));
            border-color: rgba(165, 180, 252, 0.7);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.6);
            transform: translateY(-2px);
        }

        .glass-btn:active {
            transform: translateY(1px);
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            cursor: pointer;
        }

        @keyframes shine {
            0% { background-position: -200%; }
            100% { background-position: 200%; }
        }

        .brand-text-glow {
            background: linear-gradient(90deg, #e0e7ff 0%, #a5b4fc 25%, #ffffff 50%, #a5b4fc 75%, #e0e7ff 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            animation: shine 4s linear infinite;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.6); }
            70% { transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between relative overflow-hidden">

    <!-- 3D Canvas Background -->
    <div id="webgl-container"></div>

    <!-- Header Overlay: Blankenhagen Spieleentwicklung Branding -->
    <header class="relative z-10 w-full p-4 md:p-6 flex justify-between items-center max-w-7xl mx-auto pointer-events-none">
        <div class="pointer-events-auto flex items-center gap-3.5 glass-panel px-5 py-2.5 rounded-2xl border border-indigo-500/30">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-amber-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/40">
                <i class="fa-solid fa-gamepad text-xl"></i>
            </div>
            <div>
                <div class="flex items-center gap-1.5">
                    <span class="text-[10px] font-black tracking-widest uppercase text-amber-400">BLANKENHAGEN</span>
                    <span class="text-[9px] bg-amber-500/20 text-amber-300 font-bold px-1.5 py-0.5 rounded border border-amber-500/30">STUDIO</span>
                </div>
                <h1 class="font-extrabold text-sm md:text-base tracking-tight text-white leading-tight brand-text-glow">
                    Spieleentwicklung
                </h1>
            </div>
        </div>

        <button id="sound-toggle" title="Ton umschalten" class="pointer-events-auto glass-panel w-11 h-11 rounded-2xl flex items-center justify-center text-slate-300 hover:text-white hover:border-indigo-500/50 transition shadow-lg">
            <i class="fa-solid fa-volume-high text-lg" id="sound-icon"></i>
        </button>
    </header>

    <!-- Center/Top Floating Result Badge (Appears when settled) -->
    <div id="result-badge" class="relative z-10 self-center pointer-events-none opacity-0 transition-opacity duration-500 -mt-10">
        <div class="glass-panel px-8 py-4 rounded-3xl border border-indigo-500/40 text-center flex flex-col items-center shadow-2xl">
            <span class="text-xs uppercase font-extrabold tracking-widest text-indigo-300 mb-0.5">Gewürfelt</span>
            <span id="result-number" class="text-6xl font-black text-white tracking-tight">--</span>
        </div>
    </div>

    <!-- Bottom Controls Overlay -->
    <main class="relative z-10 w-full max-w-lg mx-auto px-4 pb-4 flex flex-col gap-3 items-center pointer-events-none">
        
        <!-- Shake Sensor Toggle Button for Mobile -->
        <button id="sensor-btn" class="pointer-events-auto glass-panel px-4 py-2 rounded-2xl text-xs font-semibold text-indigo-200 hover:text-white flex items-center gap-2 border border-indigo-500/30 transition shadow-md">
            <i class="fa-solid fa-mobile-screen-button text-amber-400 text-sm"></i>
            <span id="sensor-btn-text">📱 Schüttel-Sensor aktivieren</span>
        </button>

        <!-- Main Roll Action Button -->
        <button id="roll-button" class="pointer-events-auto glass-btn w-full py-4 px-8 rounded-3xl flex items-center justify-center gap-3 text-white font-extrabold text-xl shadow-2xl">
            <i class="fa-solid fa-whiskey-glass text-2xl animate-bounce text-amber-300"></i>
            <span id="roll-btn-text">Becher schütteln & würfeln</span>
        </button>

    </main>

    <!-- Mandatory AI Footer Disclaimer -->
    <footer class="relative z-10 text-center py-2 px-4 text-[10px] md:text-[11px] text-slate-400 pointer-events-none flex flex-col gap-0.5">
        <div>
            <span class="opacity-75">Powered by</span> <strong class="text-indigo-300 font-semibold">Blankenhagen Spieleentwicklung</strong>
        </div>
        <div class="text-[9px] md:text-[10px] text-slate-400/80 italic max-w-2xl mx-auto">
            Dieser Text/Dieses Bild/Dieses Video/… wurde unter Zuhilfenahme einer Künstlichen Intelligenz erstellt und von einem Menschen überprüft.
        </div>
    </footer>

    <!-- Application Script Logic -->
    <script>
        /**
         * High-Visibility 3D Dice Cup Simulator
         * Developed for Blankenhagen Spieleentwicklung
         */

        // Web Audio API Synthesizer
        class AudioController {
            constructor() {
                this.enabled = true;
                this.audioCtx = null;
            }

            init() {
                if (!this.audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.audioCtx = new AudioContext();
                }
                if (this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
            }

            playCupClack() {
                if (!this.enabled) return;
                this.init();

                const bufferSize = this.audioCtx.sampleRate * 0.03;
                const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 600 + Math.random() * 400;
                filter.Q.value = 3;

                const gain = this.audioCtx.createGain();
                gain.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.03);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.audioCtx.destination);
                noise.start();
            }

            playBounceSound(intensity = 1) {
                if (!this.enabled) return;
                this.init();

                const bufferSize = this.audioCtx.sampleRate * 0.05;
                const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 900 + Math.random() * 500;

                const gain = this.audioCtx.createGain();
                const vol = Math.min(Math.max(intensity, 0.1), 1.0) * 0.5;
                gain.gain.setValueAtTime(vol, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.05);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.audioCtx.destination);
                noise.start();
            }
        }

        const audio = new AudioController();

        // Core 3D Variables
        let scene, camera, renderer, world;
        let dieMesh, dieBody;
        let cupGroup, cupBody;
        let cupMaterials = [];
        let isSequenceRunning = false;

        // Camera Base Positions
        const DEFAULT_CAM_POS = { x: 0, y: 11, z: 8 };
        const ZOOMED_CAM_POS = { x: 0, y: 6.5, z: 4.8 };
        let targetCamPos = { ...DEFAULT_CAM_POS };

        // Face Mapping Vector Directions
        const FACE_DIRECTIONS = [
            { number: 1, vector: new THREE.Vector3(0, 0, 1) },
            { number: 6, vector: new THREE.Vector3(0, 0, -1) },
            { number: 2, vector: new THREE.Vector3(1, 0, 0) },
            { number: 5, vector: new THREE.Vector3(-1, 0, 0) },
            { number: 3, vector: new THREE.Vector3(0, 1, 0) },
            { number: 4, vector: new THREE.Vector3(0, -1, 0) }
        ];

        // UI References
        const resultBadge = document.getElementById('result-badge');
        const resultNumber = document.getElementById('result-number');
        const rollBtn = document.getElementById('roll-button');
        const rollBtnText = document.getElementById('roll-btn-text');
        const sensorBtn = document.getElementById('sensor-btn');
        const sensorBtnText = document.getElementById('sensor-btn-text');
        const soundToggleBtn = document.getElementById('sound-toggle');
        const soundIcon = document.getElementById('sound-icon');

        window.addEventListener('DOMContentLoaded', () => {
            init3D();
            createEnvironment();
            createDie();
            createCup();
            setupEventListeners();
            animate();
        });

        function init3D() {
            const container = document.getElementById('webgl-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0f172a, 0.02);

            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(aspect < 1 ? 52 : 40, aspect, 0.1, 100);
            camera.position.set(DEFAULT_CAM_POS.x, DEFAULT_CAM_POS.y, DEFAULT_CAM_POS.z);
            camera.lookAt(0, 0.5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Cannon.js Physics
            world = new CANNON.World();
            world.gravity.set(0, -28, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 12;

            const dieMat = new CANNON.Material("die");
            const floorMat = new CANNON.Material("floor");
            const contactMat = new CANNON.ContactMaterial(floorMat, dieMat, {
                friction: 0.4,
                restitution: 0.4
            });
            world.addContactMaterial(contactMat);

            window.addEventListener('resize', onWindowResize);
        }

        function createEnvironment() {
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(8, 20, 8);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 30;
            dirLight.shadow.camera.left = -8;
            dirLight.shadow.camera.right = 8;
            dirLight.shadow.camera.top = 8;
            dirLight.shadow.camera.bottom = -8;
            scene.add(dirLight);

            const warmPointLight = new THREE.PointLight(0xf59e0b, 1.2, 18);
            warmPointLight.position.set(-4, 5, -3);
            scene.add(warmPointLight);

            // Table Mat / Ground Plane Physics
            const floorShape = new CANNON.Plane();
            const floorBody = new CANNON.Body({ mass: 0 });
            floorBody.addShape(floorShape);
            floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(floorBody);

            // Shadow Receiver Mesh
            const shadowGround = new THREE.Mesh(
                new THREE.PlaneGeometry(30, 30),
                new THREE.ShadowMaterial({ opacity: 0.35 })
            );
            shadowGround.rotation.x = -Math.PI / 2;
            shadowGround.receiveShadow = true;
            scene.add(shadowGround);

            // Boundary Walls to ensure the die stays centered
            const wallShape = new CANNON.Plane();
            const boundaryX = 3.2;
            const boundaryZ = 2.8;

            [
                { pos: [0, 0, -boundaryZ], rot: [0, 0] },
                { pos: [0, 0, boundaryZ], rot: [0, Math.PI] },
                { pos: [-boundaryX, 0, 0], rot: [0, Math.PI / 2] },
                { pos: [boundaryX, 0, 0], rot: [0, -Math.PI / 2] }
            ].forEach(w => {
                const wallBody = new CANNON.Body({ mass: 0 });
                wallBody.addShape(wallShape);
                wallBody.position.set(...w.pos);
                wallBody.quaternion.setFromEuler(w.rot[0], w.rot[1], 0);
                world.addBody(wallBody);
            });
        }

        // Texture Generator for Red Dice Canvas Faces
        function createDiceTexture(number) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#dc2626'; // Bright Red Base
            ctx.fillRect(0, 0, 256, 256);

            ctx.lineWidth = 12;
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.strokeRect(0, 0, 256, 256);

            ctx.fillStyle = '#ffffff'; // White Pips
            const r = 24;

            const dots = {
                1: [[128, 128]],
                2: [[68, 68], [188, 188]],
                3: [[68, 68], [128, 128], [188, 188]],
                4: [[68, 68], [188, 68], [68, 188], [188, 188]],
                5: [[68, 68], [188, 68], [128, 128], [68, 188], [188, 188]],
                6: [[68, 68], [188, 68], [68, 128], [188, 128], [68, 188], [188, 188]]
            };

            dots[number].forEach(([x, y]) => {
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            });

            return new THREE.CanvasTexture(canvas);
        }

        function createDie() {
            const size = 1.4;
            const geometry = new THREE.BoxGeometry(size, size, size);
            
            const faceNumbers = [2, 5, 3, 4, 1, 6];
            const materials = faceNumbers.map(num => new THREE.MeshStandardMaterial({
                map: createDiceTexture(num),
                roughness: 0.3,
                metalness: 0.1
            }));

            dieMesh = new THREE.Mesh(geometry, materials);
            dieMesh.castShadow = true;
            dieMesh.receiveShadow = true;
            scene.add(dieMesh);

            const shape = new CANNON.Box(new CANNON.Vec3(size / 2, size / 2, size / 2));
            dieBody = new CANNON.Body({
                mass: 1.2,
                shape: shape,
                linearDamping: 0.35,
                angularDamping: 0.35
            });

            dieBody.position.set(0, 0.7, 0);
            world.addBody(dieBody);

            // Impact Bounce Sound & Vibration
            let canBounce = true;
            dieBody.addEventListener("collide", (e) => {
                const speed = dieBody.velocity.norm();
                if (speed > 1.2 && canBounce) {
                    audio.playBounceSound(speed / 8);
                    if (navigator.vibrate) {
                        try { navigator.vibrate(Math.min(speed * 5, 35)); } catch(err){}
                    }
                    canBounce = false;
                    setTimeout(() => { canBounce = true; }, 80);
                }
            });
        }

        function createCup() {
            cupGroup = new THREE.Group();

            // Leather Cup Outer Shell
            const cupGeo = new THREE.CylinderGeometry(1.6, 1.2, 3.2, 32, 1, true);
            const leatherMat = new THREE.MeshStandardMaterial({
                color: 0x451a03, // Dark Brown Leather
                roughness: 0.6,
                metalness: 0.1,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0 // Initially hidden offscreen
            });
            cupMaterials.push(leatherMat);

            const cupMesh = new THREE.Mesh(cupGeo, leatherMat);
            cupMesh.castShadow = true;
            cupGroup.add(cupMesh);

            // Cup Bottom Cap
            const capGeo = new THREE.CircleGeometry(1.2, 32);
            const capMat = new THREE.MeshStandardMaterial({
                color: 0x270f02,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0
            });
            cupMaterials.push(capMat);

            const capMesh = new THREE.Mesh(capGeo, capMat);
            capMesh.rotation.x = Math.PI / 2;
            capMesh.position.y = 1.6;
            cupGroup.add(capMesh);

            // Gold Rim Accent
            const rimGeo = new THREE.TorusGeometry(1.6, 0.08, 16, 32);
            const rimMat = new THREE.MeshStandardMaterial({
                color: 0xd97706,
                metalness: 0.8,
                roughness: 0.2,
                transparent: true,
                opacity: 0
            });
            cupMaterials.push(rimMat);

            const rimMesh = new THREE.Mesh(rimGeo, rimMat);
            rimMesh.rotation.x = Math.PI / 2;
            rimMesh.position.y = -1.6;
            cupGroup.add(rimMesh);

            cupGroup.position.set(0, 8, 0); // Start high offscreen
            scene.add(cupGroup);
        }

        function setCupOpacity(opacity) {
            cupMaterials.forEach(m => {
                m.opacity = Math.max(0, Math.min(1, opacity));
            });
        }

        // Sequence: Lower cup over die, shake violently, throw die, lift away & reveal
        function executeRollSequence() {
            if (isSequenceRunning) return;
            isSequenceRunning = true;

            // UI updates
            resultBadge.classList.remove('animate-pop');
            resultBadge.style.opacity = '0';
            rollBtn.disabled = true;
            rollBtn.classList.add('opacity-50', 'cursor-not-allowed');
            rollBtnText.textContent = "Becher schüttelt...";

            // Reset camera target zoom back to normal view
            targetCamPos = { ...DEFAULT_CAM_POS };

            // Step 1: Position die at center and lower cup over it
            dieBody.position.set(0, 0.7, 0);
            dieBody.velocity.set(0, 0, 0);
            dieBody.angularVelocity.set(0, 0, 0);

            cupGroup.position.set(0, 6, 0);
            cupGroup.rotation.set(0, 0, 0);
            setCupOpacity(1);

            let startTime = performance.now();

            // Lowering Animation
            function lowerStep(now) {
                const elapsed = (now - startTime) / 350;
                if (elapsed < 1) {
                    cupGroup.position.y = 6 - elapsed * 4.2; // Move down to y=1.8
                    requestAnimationFrame(lowerStep);
                } else {
                    cupGroup.position.y = 1.8;
                    startShakingPhase();
                }
            }
            requestAnimationFrame(lowerStep);
        }

        function startShakingPhase() {
            let shakeCount = 0;
            const maxShakes = 16;

            function shakeInterval() {
                if (shakeCount < maxShakes) {
                    // Random rattle jitter
                    const rx = (Math.random() - 0.5) * 0.4;
                    const rz = (Math.random() - 0.5) * 0.4;
                    const rotZ = (Math.random() - 0.5) * 0.3;

                    cupGroup.position.x = rx;
                    cupGroup.position.z = rz;
                    cupGroup.rotation.z = rotZ;

                    // Also jitter the die inside
                    dieBody.position.x = rx * 0.5;
                    dieBody.position.z = rz * 0.5;
                    dieBody.angularVelocity.set(
                        (Math.random() - 0.5) * 15,
                        (Math.random() - 0.5) * 15,
                        (Math.random() - 0.5) * 15
                    );

                    audio.playCupClack();
                    if (navigator.vibrate) {
                        try { navigator.vibrate(20); } catch(e){}
                    }

                    shakeCount++;
                    setTimeout(shakeInterval, 60);
                } else {
                    throwDiePhase();
                }
            }
            shakeInterval();
        }

        function throwDiePhase() {
            // Step 3: Lift cup, tilt forward, and launch die
            rollBtnText.textContent = "Würfel rollt...";

            const launchX = (Math.random() - 0.5) * 6;
            const launchZ = (Math.random() - 0.5) * 5 - 1;
            const launchY = Math.random() * 3 + 4;

            dieBody.position.set(0, 1.5, 0);
            dieBody.velocity.set(launchX, launchY, launchZ);
            dieBody.angularVelocity.set(
                (Math.random() - 0.5) * 30,
                (Math.random() - 0.5) * 30,
                (Math.random() - 0.5) * 30
            );

            // Lift cup up and tilt dramatically
            let startTime = performance.now();
            function liftStep(now) {
                const elapsed = (now - startTime) / 450;
                if (elapsed < 1) {
                    cupGroup.position.y = 1.8 + elapsed * 5;
                    cupGroup.position.z = -elapsed * 2;
                    cupGroup.rotation.x = -elapsed * 1.2;
                    setCupOpacity(1 - elapsed); // Fade out cup completely so die is clear
                    requestAnimationFrame(liftStep);
                } else {
                    cupGroup.position.set(0, 10, 0);
                    setCupOpacity(0);
                    waitForDieSettled();
                }
            }
            requestAnimationFrame(liftStep);
        }

        function waitForDieSettled() {
            let checkCount = 0;

            function check() {
                const speed = dieBody.velocity.norm();
                const angSpeed = dieBody.angularVelocity.norm();

                if ((speed < 0.08 && angSpeed < 0.08) || checkCount > 100) {
                    // Die has settled!
                    revealResult();
                } else {
                    checkCount++;
                    setTimeout(check, 80);
                }
            }
            setTimeout(check, 400);
        }

        function getLandedValue() {
            const matrix = new THREE.Matrix4();
            matrix.extractRotation(dieMesh.matrix);

            let maxDot = -Infinity;
            let result = 1;
            const worldUp = new THREE.Vector3(0, 1, 0);

            FACE_DIRECTIONS.forEach(face => {
                const normal = face.vector.clone().applyMatrix4(matrix);
                const dot = normal.dot(worldUp);
                if (dot > maxDot) {
                    maxDot = dot;
                    result = face.number;
                }
            });

            return result;
        }

        function revealResult() {
            const landedNumber = getLandedValue();
            
            // Display badge
            resultNumber.textContent = landedNumber;
            resultBadge.style.opacity = '1';
            resultBadge.classList.add('animate-pop');

            // Smoothly zoom camera toward the landed die location for optimal visibility
            targetCamPos = {
                x: dieBody.position.x * 0.4,
                y: ZOOMED_CAM_POS.y,
                z: dieBody.position.z + ZOOMED_CAM_POS.z
            };

            // Re-enable UI
            isSequenceRunning = false;
            rollBtn.disabled = false;
            rollBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            rollBtnText.textContent = "Erneut schütteln";
        }

        // Render & Physics Loop
        function animate() {
            requestAnimationFrame(animate);

            world.step(1 / 60);

            // Sync Die Mesh with Physics Body
            dieMesh.position.copy(dieBody.position);
            dieMesh.quaternion.copy(dieBody.quaternion);

            // Smooth Camera Interpolation (Zoom in on settled result)
            camera.position.x += (targetCamPos.x - camera.position.x) * 0.05;
            camera.position.y += (targetCamPos.y - camera.position.y) * 0.05;
            camera.position.z += (targetCamPos.z - camera.position.z) * 0.05;
            
            if (isSequenceRunning) {
                camera.lookAt(0, 0.5, 0);
            } else {
                camera.lookAt(dieMesh.position.x * 0.5, 0.5, dieMesh.position.z * 0.5);
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.fov = aspect < 1 ? 52 : 40;
            camera.aspect = aspect;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupEventListeners() {
            rollBtn.addEventListener('click', executeRollSequence);

            document.getElementById('webgl-container').addEventListener('click', () => {
                if (!isSequenceRunning) executeRollSequence();
            });

            // Mobile Shake Sensor Detection Setup
            let lastShakeTime = 0;
            let lastX = null, lastY = null, lastZ = null;

            function handleMotion(event) {
                const current = event.accelerationIncludingGravity || event.acceleration;
                if (!current) return;

                const now = Date.now();
                if ((now - lastShakeTime) < 1200) return; // Cooldown

                if (lastX !== null) {
                    const deltaX = Math.abs(current.x - lastX);
                    const deltaY = Math.abs(current.y - lastY);
                    const deltaZ = Math.abs(current.z - lastZ);

                    // Threshold for a vigorous shake
                    if (deltaX + deltaY + deltaZ > 22) {
                        lastShakeTime = now;
                        executeRollSequence();
                    }
                }

                lastX = current.x;
                lastY = current.y;
                lastZ = current.z;
            }

            sensorBtn.addEventListener('click', () => {
                audio.init();
                
                // Request iOS 13+ DeviceMotionEvent permissions if required
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    DeviceMotionEvent.requestPermission()
                        .then(response => {
                            if (response === 'granted') {
                                window.addEventListener('devicemotion', handleMotion, true);
                                sensorBtnText.textContent = "✓ Schüttel-Sensor aktiv";
                                sensorBtn.classList.add('border-emerald-500/50', 'text-emerald-300');
                            } else {
                                sensorBtnText.textContent = "Sensor abgelehnt";
                            }
                        })
                        .catch(console.error);
                } else if ('DeviceMotionEvent' in window) {
                    window.addEventListener('devicemotion', handleMotion, true);
                    sensorBtnText.textContent = "✓ Schüttel-Sensor aktiv";
                    sensorBtn.classList.add('border-emerald-500/50', 'text-emerald-300');
                } else {
                    sensorBtnText.textContent = "Sensor nicht unterstützt";
                }
            });

            // Sound Toggle
            soundToggleBtn.addEventListener('click', () => {
                audio.enabled = !audio.enabled;
                if (audio.enabled) {
                    soundIcon.className = 'fa-solid fa-volume-high text-lg';
                    soundToggleBtn.classList.remove('opacity-50');
                } else {
                    soundIcon.className = 'fa-solid fa-volume-xmark text-lg';
                    soundToggleBtn.classList.add('opacity-50');
                }
            });
        }
    </script>
</body>
</html>
